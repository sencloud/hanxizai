<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="description" content="《韩熙载夜宴图》互动长卷：沿屏风逐段漫游，听乐、观舞、歇息、清吹、送别，看烛影从掌灯摇到更残。">
<title>韩熙载夜宴图 · 可漫游的夜宴长卷</title>
<meta name="theme-color" content="#171310">
<!-- 分享卡片：微信抓的是页面里尺寸够大的图片，而本页是纯画布、没有可见图片，
     所以下面放一张 300×300 的缩略图专门给抓取用；og 标签供其他平台使用。 -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="韩熙载夜宴图">
<meta property="og:title" content="韩熙载夜宴图 · 可漫游的夜宴长卷">
<meta property="og:description" content="五段夜宴：听乐、观舞、歇息、清吹、送别，烛影从掌灯摇到天将明。点开就能走进去。">
<meta property="og:url" content="https://sencloud.github.io/hanxizai/">
<meta property="og:image" content="https://sencloud.github.io/hanxizai/docs/promo/07-share-card.png">
<meta property="og:image:width" content="600">
<meta property="og:image:height" content="600">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="stylesheet" href="styles/handscroll.css">
</head>
<body>
<div id="stage" class="stage">
  <img class="share-thumb" src="docs/promo/07-share-card.png" width="300" height="300"
       alt="韩熙载夜宴图 · 可漫游的夜宴长卷" aria-hidden="true">
  <canvas id="scroll" class="layer scroll" role="img"
    aria-label="《韩熙载夜宴图》互动长卷：听乐、观舞、歇息、清吹、送别五段。"></canvas>
  <canvas id="smoke" class="layer smoke" aria-hidden="true"></canvas>

  <div class="hud" id="hud">
    <header class="hud-title">
      <h1>韩熙载夜宴图</h1>
      <p>五代 · 顾闳中（摹本）· 互动再创作</p>
    </header>

    <div class="hud-clock" id="clock">
      <span class="dot"></span>
      <span id="clock-label">掌灯</span>
    </div>
  </div>

  <div class="chapter" id="chapter" aria-live="polite">
    <p class="chapter-index" id="chapter-index">其一</p>
    <h2 id="chapter-name">听乐</h2>
    <p id="chapter-note">李家小妹抱琵琶，满堂屏息。</p>
  </div>

  <div class="controls" id="controls">
    <button class="btn nav" id="walk-left" type="button" aria-label="向左漫游长卷">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4 7 12l8 8"/></svg>
    </button>
    <button class="btn nav" id="walk-right" type="button" aria-label="向右漫游长卷">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4l8 8-8 8"/></svg>
    </button>
  </div>

  <nav class="sections" id="sections" aria-label="长卷分段"></nav>

  <div class="tools" id="tools">
    <button class="tool" id="tool-auto" type="button" aria-pressed="false">自动漫游</button>
    <button class="tool" id="tool-sound" type="button" aria-pressed="false">开卷听声</button>
    <button class="tool" id="tool-pause" type="button" aria-pressed="false">暂歇</button>
    <button class="tool" id="tool-zoom-in" type="button" aria-label="放大">＋</button>
    <button class="tool" id="tool-zoom-out" type="button" aria-label="缩小">－</button>
    <button class="tool tool-original" id="tool-original" type="button" aria-haspopup="dialog" aria-controls="original">看原图</button>
  </div>

  <p class="hint" id="hint">长卷自右向左展开 · ← 前行，→ 回看，或拖动 · 点击画中人器物 · 右下角可看原图批注</p>
  <p class="sr-only" id="live" aria-live="polite"></p>
</div>

<div id="original" class="orig" role="dialog" aria-modal="true" aria-labelledby="orig-title" hidden></div>

<script src="src/util.js"></script>
<script src="src/palette.js"></script>
<script src="src/figure-atlas.js"></script>
<script src="src/layout.js"></script>
<script src="src/sprite.js"></script>
<script src="src/plate.js"></script>
<script src="src/score.js"></script>
<script src="src/scroll-life.js"></script>
<script src="src/dance-event.js"></script>
<script src="src/light.js"></script>
<script src="src/audio.js"></script>
<script src="src/smoke.js"></script>
<script src="src/annotations.js"></script>
<script src="src/original.js"></script>
<script src="src/scene.js"></script>
</body>
</html>
